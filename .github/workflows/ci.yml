name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  examples:
    name: build examples (thumbv6m)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 生态依赖不再需要克隆任何仓：PAC 与 HAL 走 crates.io 版本依赖
      # （精确钉版），embassy-cw32 走 git 依赖（未发布，0.4.0 待定档），
      # cargo 在 resolve 时自动拉取。

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv6m-none-eabi

      - uses: Swatinem/rust-cache@v2

      - name: build all chapter examples
        run: cargo build --workspace --target thumbv6m-none-eabi --release --examples

  book:
    name: mdbook build (zh + en)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: latest

      # 中文版（根）+ 英文版（en/ 子配置，输出到 book-en/），
      # 组装成单一 Pages 站点：/ = 中文，/en/ = 英文
      - run: |
          mdbook build
          mdbook build en
          mkdir site
          cp -r book/. site/
          mkdir site/en
          cp -r book-en/. site/en/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: book
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
