[package]
name = "cw32-book-pac"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
cw32l012-pac = { path = "../../../cw32l012-pac", features = ["rt"] }

# lib.rs 的 board 模块用 cortex-m 的 SYST（SysTick 核心外设）做忙等延时。
# SysTick 是 ARM 核心外设（0xE000_E010），手写 PAC 不建模；cortex-m 已在
# 工作区依赖树中（embassy-executor 的 cortex-m 平台层引入），这里显式声明
# 同一 0.7 版本以便 lib 直接使用。仅对 ARM 裸机目标启用（宿主机上
# cortex-m 平台代码编译不过）。不开任何 feature——critical-section 实现
# 由各例程自备（ch03）或由 embassy-cw32 提供，cortex-m 不得掺和。
[target.'cfg(all(target_arch = "arm", target_os = "none"))'.dependencies]
cortex-m = "0.7"

# 例程依赖仅对 ARM 裸机目标启用（宿主机上 cortex-m 平台代码编译不过）
[target.'cfg(all(target_arch = "arm", target_os = "none"))'.dev-dependencies]
cortex-m-rt = { version = "0.7", features = ["device"] }
# ch03_rtt：defmt-rtt 的日志锁需要 critical-section 实现——裸机 M0+ 没有现成
# 实现，例程内自带 PRIMASK 版（与 embassy-cw32/hal 各自的实现同一个写法）。
# restore-state-u8 与 embassy-cw32 的声明一致：workspace 内多例程统一编译
# critical-section 时，restore-state feature 必须全局唯一，否则编译报错。
critical-section = { version = "1", default-features = false, features = ["restore-state-u8"] }
defmt = "1"
defmt-rtt = "0.4"
panic-probe = { version = "0.3", features = ["print-defmt"] }

[[example]]
name = "ch02_blink"
path = "examples/ch02_blink.rs"

[[example]]
name = "ch03_rtt"
path = "examples/ch03_rtt.rs"

[[example]]
name = "ch02_blink_lib"
path = "examples/ch02_blink_lib.rs"
